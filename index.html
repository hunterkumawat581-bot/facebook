<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook story clone</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <!-- navbar -->
    <div class="navbar">
        <div class="nav-left">
            <img src="https://static.vecteezy.com/system/resources/previews/018/930/698/non_2x/facebook-logo-facebook-icon-transparent-free-png.png" alt="" class="logo">
            <input type="text" class="search-bar" placeholder="search facebook">
        </div>
        <div class="nav-center">
            <span class="material-symbols-outlined nav-icon">
                home
            </span>

            <span class="material-symbols-outlined nav-icon">
                live_tv
            </span>

            <span class="material-symbols-outlined nav-icon">
                storefront
            </span>

            <span class="material-symbols-outlined nav-icon">
                groups
            </span>
            <span class="material-symbols-outlined nav-icon">
                explore
            </span>

        </div>
        <div class="nav-right">
            <span class="material-symbols-outlined circle-icon">
                add
            </span>
            <span class="material-symbols-outlined circle-icon">
                notifications
            </span>
            <span class="material-symbols-outlined circle-icon">
                chat
            </span>
            <img src="d.jpg" alt="profile" class="profile-pic">
            
        </div>
    </div>
    <!-- story section -->
     <div class="story-section">
        <div class="story-container">
            <div class="story">
                <img src="1.jpg" alt="Story" class="story-main-img">
                <img src="2.jpg" alt="Profile" class="story-profile">
                <p class="story-user">YOUR STORY</p>
            </div>
             <div class="story">
                <img src="a.jpeg" alt="Story" class="story-main-img">
                <img src="b.jpeg" alt="Profile" class="story-profile">
                <p class="story-user">IFM EMPIRE</p>
            </div>
             <div class="story">
                <img src="c.jpeg" alt="Story" class="story-main-img">
                <img src="d.jpeg" alt="Profile" class="story-profile">
                <p class="story-user">DEVIL GOD</p>
            </div>
             <div class="story">
                <img src="e.jpeg" alt="Story" class="story-main-img">
                <img src="g.jpeg" alt="Profile" class="story-profile">
                <p class="story-user">FLEX DEVA</p>
            </div>
             <div class="story">
                <img src="k.jpeg" alt="Story" class="story-main-img">
                <img src="l.jpeg" alt="Profile" class="story-profile">
                <p class="story-user">GOD EMPIRE</p>
            </div>
        </div>

     </div>
     
</body>

</html>
